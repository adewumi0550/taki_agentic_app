<title>DevFest Owerri Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
/* One column, five screens: splash -> name -> question -> result -> board.
   Every surface is an outlined DevFest sticker. Single theme on purpose. */
:root{
  --bg:#F0F0F0; --ink:#1E1E1E; --card:#FFFFFF; --muted:#5F6368;
  --blue:#4285F4; --green:#34A853; --yellow:#F9AB00; --red:#EA4335;
  --p-blue:#C3ECF6; --p-green:#CCF6C5; --p-yellow:#FFE7A5; --p-red:#F8D8D8;
  --h-blue:#57CAFF; --h-green:#5CDB6D; --h-yellow:#FFD427; --h-red:#FF7DAF;
  --line:3px solid #1E1E1E; --r:22px;
  --display:'Fredoka',system-ui,sans-serif;
  --body:'Roboto',Arial,sans-serif;
  --mono:'Roboto Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 44px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
p{margin:0}
button{font-family:var(--body);cursor:pointer;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);
  padding-block:13px;display:flex;align-items:center;gap:10px}
.mark{height:20px;width:auto;display:block;flex:none}
.rule{width:2px;height:20px;background:var(--ink);flex:none}
.barname{font-family:var(--display);font-weight:700;font-size:18px;flex:1;min-width:0}
.pill{font-family:var(--mono);font-weight:700;font-size:13px;background:var(--card);
  border:var(--line);border-radius:999px;padding:5px 13px;white-space:nowrap}

.card{background:var(--card);border:var(--line);border-radius:var(--r);padding:24px}
.stage{display:flex;flex-direction:column;gap:16px;animation:rise .35s cubic-bezier(.2,1.2,.4,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted)}

.btn{font-family:var(--display);font-weight:600;font-size:19px;border:var(--line);
  border-radius:999px;padding:15px 32px;background:var(--h-yellow);
  box-shadow:0 5px 0 var(--ink);transition:transform .12s,box-shadow .12s;width:100%}
.btn:hover{transform:translateY(2px);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.btn[disabled]{opacity:.42;transform:none;box-shadow:0 5px 0 var(--ink);cursor:not-allowed}
.btn.ghost{background:var(--card);font-size:16px;padding:12px 24px}

input[type=text]{font-family:var(--body);font-size:20px;padding:15px 18px;border:var(--line);
  border-radius:16px;background:var(--bg);width:100%;color:var(--ink)}
label{font-weight:700;font-size:15px;display:block;padding-bottom:8px}

/* prizes */
.prizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prize{border:var(--line);border-radius:18px;padding:16px 10px;text-align:center;
  display:flex;flex-direction:column;gap:5px}
.prize b{font-family:var(--display);font-size:25px;font-weight:700;line-height:1}
.prize span{font-family:var(--mono);font-size:12px;font-weight:700}

/* question */
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer{height:14px;border:var(--line);border-radius:999px;background:var(--card);overflow:hidden}
.timer i{display:block;height:100%;background:var(--h-green);width:100%;
  transition:width .25s linear,background .25s}
.qtext{font-family:var(--display);font-size:clamp(22px,5.2vw,30px);font-weight:600;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;font-size:17px;font-weight:500;border:var(--line);border-radius:16px;
  padding:16px 18px;background:var(--card);display:flex;gap:12px;align-items:flex-start;
  box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.opt:hover:not([disabled]){transform:translateY(2px);box-shadow:0 2px 0 var(--ink);background:var(--p-yellow)}
.opt .key{font-family:var(--mono);font-weight:700;flex:none}
.opt.right{background:var(--p-green)} .opt.wrong{background:var(--p-red)}
.opt[disabled]{cursor:default}

/* result + board */
.ring{width:124px;height:124px;border-radius:50%;border:var(--line);display:grid;
  place-items:center;flex:none;background:var(--h-yellow)}
.ring b{font-family:var(--display);font-size:38px;font-weight:700;line-height:1}
.ring small{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1px}
.rowline{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding:11px 4px}
.rowline:last-child{border-bottom:0}
.rk{font-family:var(--mono);font-weight:700;font-size:17px;width:34px;flex:none}
.nm{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.me{background:var(--p-yellow);border-radius:10px}
.tag{font-family:var(--mono);font-size:11px;font-weight:700;border:2px solid var(--ink);
  border-radius:999px;padding:2px 9px;flex:none}

.pop{position:fixed;left:50%;top:24%;transform:translateX(-50%);font-family:var(--display);
  font-weight:700;font-size:42px;pointer-events:none;z-index:50;
  animation:pop 1s ease-out forwards;text-shadow:0 3px 0 var(--h-yellow)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,14px) scale(.8)}
  22%{opacity:1;transform:translate(-50%,0) scale(1.1)}75%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-30px)}}
.conf{position:fixed;width:10px;height:15px;z-index:49;pointer-events:none;border:2px solid var(--ink)}
.note{font-size:13px;color:var(--muted);line-height:1.5}
</style>

<script>
/* ---------------- questions ----------------
   Event answers come from the GDG event page for DevFest Owerri 2026;
   the rest are from the agentic-era stack the day is themed on. */
const QS = [
  {q:"What does HTML stand for?",
   a:["HyperText Markup Language","Home Tool Markup Language",
      "High Text Machine Language","Hyperlink Text Mail Language"],c:0},
  {q:"What does WWW stand for?",
   a:["World Wide Web","Wide World Web","World Web Wire","Web Wide World"],c:0},
  {q:"What is a website?",
   a:["A collection of related web pages","A single photo online",
      "A type of computer","A mobile phone network"],c:0},
  {q:"What does URL stand for?",
   a:["Uniform Resource Locator","Universal Reading Link",
      "United Resource Line","User Request Language"],c:0},
  {q:"Which one of these is a web browser?",
   a:["Google Chrome","Microsoft Word","WhatsApp","Photoshop"],c:0},
  {q:"Which language is used to style a web page?",
   a:["CSS","HTML","SQL","JSON"],c:0},
  {q:"What does CPU stand for?",
   a:["Central Processing Unit","Computer Power Unit",
      "Central Program Utility","Core Processing Underlay"],c:0},
  {q:"What does RAM stand for?",
   a:["Random Access Memory","Read And Modify",
      "Rapid Access Module","Remote Access Memory"],c:0},
  {q:"What does AI stand for?",
   a:["Artificial Intelligence","Automatic Internet",
      "Applied Information","Advanced Interface"],c:0},
  {q:"In \u201ccloud computing\u201d, where does your data actually live?",
   a:["On servers you reach over the internet","Inside your phone battery",
      "On a CD in your drawer","In the sky, literally"],c:0},
  {q:"What does it mean to download a file?",
   a:["Copy it from the internet onto your device",
      "Send it from your device to a friend",
      "Delete it from your device","Print it on paper"],c:0},
  {q:"Which symbol always appears in an email address?",
   a:["@","#","&","%"],c:0},
  {q:"Which company makes the Android operating system?",
   a:["Google","Apple","Microsoft","Samsung"],c:0},
  {q:"In software, what is a \u201cbug\u201d?",
   a:["An error that makes a program behave wrongly","A helpful new feature",
      "A type of keyboard","A kind of password"],c:0},
  {q:"What does PDF stand for?",
   a:["Portable Document Format","Personal Data File",
      "Printed Document Form","Public Display Format"],c:0},
  {q:"What is Wi-Fi used for?",
   a:["Connecting to a network without cables","Charging a laptop",
      "Storing files permanently","Cooling a computer"],c:0},
  {q:"Which city is hosting this DevFest?",
   a:["Owerri","Lagos","Abuja","Enugu"],c:0},
  {q:"What does GDE stand for?",
   a:["Google Developer Expert","Global Developer Exchange",
      "Google Design Engineer","General Development Environment"],c:0},
  {q:"What does the GDG in GDG Owerri stand for?",
   a:["Google Developer Groups","Global Digital Group",
      "General Developer Guild","Google Design Gallery"],c:0},
  {q:"What is the main job of a web browser?",
   a:["To open and display websites","To charge your phone",
      "To write emails only","To take photographs"],c:0},
  {q:"A file ending in .jpg is most likely what?",
   a:["A picture","A song","A video","A spreadsheet"],c:0}
];
const ROUND = 10, TOTAL_SECS = 180, PER_CORRECT = 120, SEC_BONUS = 4;
const mmss = s => Math.floor(s/60)+":"+String(Math.max(0,s%60)).padStart(2,"0");
const PRIZES = [["1st","₦10,000","var(--h-yellow)"],["2nd","₦7,000","var(--p-blue)"],
                ["3rd","₦5,000","var(--p-red)"]];

const S = {stage:0, name:"", qs:[], i:0, score:0, correct:0, streak:0,
           deadline:0, left:TOTAL_SECS, timer:null, rank:null, board:[],
           live:false, locked:false, ranOut:false};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app = document.getElementById("app");

fetch("health").then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.ok){S.live=true; refreshBoard();} }).catch(()=>{});

function pop(txt){
  const p=document.createElement("div"); p.className="pop"; p.textContent=txt;
  document.body.appendChild(p); setTimeout(()=>p.remove(),1000);
}
function confetti(){
  const cols=["var(--h-blue)","var(--h-green)","var(--h-yellow)","var(--h-red)"];
  for(let i=0;i<30;i++){
    const d=document.createElement("div"); d.className="conf";
    d.style.background=cols[i%4]; d.style.left=(12+Math.random()*76)+"vw"; d.style.top="-20px";
    document.body.appendChild(d);
    d.animate([{top:"-20px",opacity:1,transform:"rotate(0deg)"},
               {top:(70+Math.random()*25)+"vh",opacity:0,transform:"rotate("+Math.random()*720+"deg)"}],
      {duration:1400+Math.random()*800,easing:"cubic-bezier(.3,.7,.6,1)"}).onfinish=()=>d.remove();
  }
}
function hud(){ document.getElementById("hud").textContent = S.score+" pts"; }
function go(n){ S.stage=n; render(); window.scrollTo({top:0}); }

/* ---------------- screens ---------------- */
const splash = () => `
<section class="stage">
  <div class="card" style="background:var(--p-blue);text-align:center">
    <p class="eyebrow">DevFest Owerri 2026 · The Ridge Event Centre</p>
    <h1 style="font-size:clamp(30px,7.5vw,46px);line-height:1.08;padding:10px 0 12px">
      Build, Secure,<br>Scale — the Quiz</h1>
    <p style="font-size:17px;line-height:1.5">${ROUND} quick questions on the basics \u2014 the web, computers and
      today's event \u2014 and <b>3 minutes</b> for the lot. Finish early and the
      clock pays you the difference.</p>
  </div>
  <div class="prizes">
    ${PRIZES.map(([p,m,c])=>`<div class="prize" style="background:${c}">
      <span>${p} PLACE</span><b>${m}</b></div>`).join("")}
  </div>
  <button class="btn" data-go="1">Play →</button>
  <div id="boardwrap"></div>
  <p class="note">One entry per name — your best run counts. Winners are read out
    during Games and giveaways at 2:40 PM.</p>
</section>`;

const askName = () => `
<section class="stage">
  <div class="card">
    <p class="eyebrow">Before we start</p>
    <h2 style="font-size:27px;padding:6px 0 16px">What name goes on the board?</h2>
    <label for="nm">Your name</label>
    <input id="nm" type="text" maxlength="24" placeholder="e.g. Chidinma O." value="${esc(S.name)}">
    <div style="padding-top:18px"><button class="btn" id="start" disabled>Start the ${ROUND} questions</button></div>
  </div>
  <p class="note">Use the name you'd answer to if it's called out on stage.</p>
</section>`;

const question = () => {
  const q = S.qs[S.i];
  return `
<section class="stage">
  <div class="qmeta">
    <span class="pill">Q${S.i+1} / ${ROUND}</span>
    <span class="pill" style="background:var(--p-green)">${S.correct} right</span>
    ${S.streak>1?`<span class="pill" style="background:var(--h-yellow)">🔥 ${S.streak} streak</span>`:""}
    <span style="flex:1"></span>
    <span class="pill" id="clock" style="font-size:17px">${mmss(S.left)}</span>
  </div>
  <div class="timer"><i id="tbar"></i></div>
  <div class="card">
    <p class="qtext">${esc(q.q)}</p>
  </div>
  <div class="opts" id="opts">
    ${q.order.map((oi,n)=>`<button class="opt" data-pick="${oi}">
      <span class="key">${"ABCD"[n]}</span><span>${esc(q.a[oi])}</span></button>`).join("")}
  </div>
</section>`;
};

const result = () => {
  const max = ROUND*PER_CORRECT + TOTAL_SECS*SEC_BONUS;
  const prize = S.rank && S.rank<=3 ? PRIZES[S.rank-1] : null;
  return `
<section class="stage">
  <div class="card" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
    <div class="ring"><div style="text-align:center">
      <b>${S.score}</b><br><small>OF ${max}</small></div></div>
    <div style="flex:1;min-width:0">
      <h2 style="font-size:25px">${esc(S.name.split(/\s+/)[0])}, ${S.correct}/${ROUND} right</h2>
      <p style="font-size:15px;padding-top:4px">
        ${S.correct}&times;${PER_CORRECT} = ${S.correct*PER_CORRECT} pts${
          S.bonus?` &middot; <b>+${S.bonus}</b> for the ${mmss(S.left)} left on the clock`
                 :(S.ranOut?` &middot; <b>time ran out</b>, no clock bonus`:"")}</p>
      <p style="font-size:16px;color:var(--muted);padding-top:6px">
        ${S.rank?`You are <b style="color:var(--ink)">#${S.rank}</b> of ${S.board.length||"?"} players.`
                :"Scored locally — the board is offline."}</p>
      ${prize?`<p style="font-size:19px;font-weight:700;padding-top:8px">
        ${prize[0]} place right now · ${prize[1]}</p>`:""}
    </div>
  </div>
  <div id="boardwrap"></div>
  <button class="btn ghost" id="again">Play again</button>
  <p class="note">Your best run is the one that counts, so a second attempt can only help.</p>
</section>`;
};

function boardHTML(){
  if(!S.live) return `<div class="card"><p class="note">Leaderboard unavailable from here.</p></div>`;
  if(!S.board.length) return `<div class="card"><p class="eyebrow">Leaderboard</p>
    <p style="padding-top:8px">No scores yet — be first on the board.</p></div>`;
  return `<div class="card">
    <p class="eyebrow">Leaderboard · top ${Math.min(10,S.board.length)}</p>
    <div style="padding-top:6px">
    ${S.board.slice(0,10).map((e,i)=>`
      <div class="rowline ${e.name.toLowerCase()===S.name.toLowerCase()?"me":""}">
        <span class="rk">${i<3?["🥇","🥈","🥉"][i]:"#"+(i+1)}</span>
        <span class="nm">${esc(e.name)}</span>
        ${i<3?`<span class="tag" style="background:${PRIZES[i][2]}">${PRIZES[i][1]}</span>`:""}
        <span class="sc">${e.score}</span>
      </div>`).join("")}
    </div></div>`;
}
function paintBoard(){
  const w=document.getElementById("boardwrap");
  if(w) w.innerHTML = boardHTML();
}
async function refreshBoard(){
  try{
    const r=await fetch("leaderboard"); const j=await r.json();
    S.board=j.board||[]; S.live=true; paintBoard();
  }catch{ S.live=false; paintBoard(); }
}

/* ---------------- flow ---------------- */
function render(){ app.innerHTML=[splash,askName,question,result][S.stage](); wire(); }

function startRound(){
  const pick=[...QS].sort(()=>Math.random()-0.5).slice(0,ROUND);
  S.qs = pick.map(q=>({...q, order:[0,1,2,3].sort(()=>Math.random()-0.5)}));
  Object.assign(S,{i:0,score:0,correct:0,streak:0,rank:null,locked:false,
                   ranOut:false,left:TOTAL_SECS,deadline:Date.now()+TOTAL_SECS*1000});
  hud(); go(2); startClock();
}

function startClock(){
  clearInterval(S.timer);
  S.timer=setInterval(()=>{
    const ms=Math.max(0,S.deadline-Date.now());
    S.left=Math.ceil(ms/1000);
    const pct=ms/(TOTAL_SECS*1000);
    const bar=document.getElementById("tbar"), c=document.getElementById("clock");
    if(bar){ bar.style.width=(pct*100)+"%";
      bar.style.background = pct>.5?"var(--h-green)":pct>.25?"var(--h-yellow)":"var(--h-red)"; }
    if(c){ c.textContent=mmss(S.left);
      c.style.background = pct>.25?"var(--card)":"var(--h-red)"; }
    if(ms<=0){ clearInterval(S.timer); S.ranOut=true; S.locked=true; finish(); }
  },200);
}

function answer(pick){
  if(S.locked) return;
  S.locked=true;                 // lifted when the next question renders
  const q=S.qs[S.i], right = pick===q.c;
  if(right){ S.score+=PER_CORRECT; S.correct++; S.streak++; pop("+"+PER_CORRECT); }
  else { S.streak=0; }
  hud();
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;
    const oi=+b.dataset.pick;
    if(oi===q.c) b.classList.add("right");
    else if(oi===pick) b.classList.add("wrong");
  });
  setTimeout(()=>{
    if(S.ranOut) return;
    S.i++;
    if(S.i>=ROUND) finish(); else { render(); S.locked=false; }
  }, right?650:1250);
}

async function finish(){
  clearInterval(S.timer);
  S.bonus = S.ranOut ? 0 : Math.max(0,S.left)*SEC_BONUS;
  S.score += S.bonus;
  hud();
  if(S.correct>=ROUND*0.7) confetti();
  if(S.live){
    try{
      const r=await fetch("score",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({name:S.name,score:S.score,correct:S.correct})});
      const j=await r.json(); S.rank=j.rank; S.board=j.board||[];
    }catch{ S.live=false; }
  }
  go(3);
}

function wire(){
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
  paintBoard();

  const nm=document.getElementById("nm");
  if(nm){
    const st=document.getElementById("start");
    const sync=()=>{S.name=nm.value.trim(); st.disabled=S.name.length<2;};
    nm.oninput=sync; sync();
    nm.onkeydown=e=>{if(e.key==="Enter"&&!st.disabled)st.click();};
    st.onclick=startRound;
  }
  app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>answer(+b.dataset.pick));
  const again=document.getElementById("again");
  if(again) again.onclick=()=>{refreshBoard(); startRound();};
}

render();
</script>
